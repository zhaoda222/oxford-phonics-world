<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Oxford Phonics World 1-3 自然拼读学习乐园</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4F46E5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <div style="font-size: 1.8rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));">🦁</div>
        <div class="app-title-group">
          <h1>Phonics World</h1>
          <p>Oxford 1-3 级自然拼读学习</p>
        </div>
      </div>
      <div class="header-stats">
        <div class="stat-pill">
          <span>⭐</span>
          <span id="star-count">0</span>
        </div>
      </div>
    </header>

    <!-- Level Selector Tabs -->
    <nav class="level-selector-row" id="level-tabs">
      <!-- Generated via JS -->
    </nav>

    <!-- Main Content Viewport -->
    <main class="screen-viewport" id="screen-viewport">
      <!-- Dynamic Screens (Learn / Units / Quiz / Flashcard / Spell) -->
    </main>

    <!-- Bottom App Navigation -->
    <footer class="bottom-nav">
      <div class="nav-item active" data-tab="learn">
        <div class="icon">📖</div>
        <div>课程</div>
      </div>
      <div class="nav-item" data-tab="flashcards">
        <div class="icon">🃏</div>
        <div>闪卡</div>
      </div>
      <div class="nav-item" data-tab="quiz">
        <div class="icon">🎯</div>
        <div>辩音练</div>
      </div>
      <div class="nav-item" data-tab="spell">
        <div class="icon">🔤</div>
        <div>拼词游</div>
      </div>
    </footer>

    <!-- Unit Detail Modal -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title" id="modal-title">Unit Details</div>
          <button class="btn-close" id="btn-modal-close">✕</button>
        </div>
        <div class="modal-body" id="modal-body">
          <!-- Dynamic word cards & practice button -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
